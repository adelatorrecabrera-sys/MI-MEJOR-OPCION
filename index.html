<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Mejor Opción</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: auto;
      padding: 20px;
      background: #f4f4f4;
    }

    h1{
      color:#0a5;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,.1);
    }

    input,
    select{
      width:100%;
      padding:10px;
      margin-top:5px;
      margin-bottom:15px;
      box-sizing:border-box;
    }

    button{
      background:#0a5;
      color:white;
      border:none;
      padding:12px;
      cursor:pointer;
      border-radius:5px;
      width:100%;
      font-size:16px;
    }

    button:hover{
      background:#087;
    }

    #resultado{
      margin-top:20px;
      padding:20px;
      background:white;
      border-radius:10px;
      display:none;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🚗 Mi Mejor Opción</h1>

    <p>
      Encuentra la gasolinera más rentable teniendo en cuenta
      el precio del combustible y el coste del desplazamiento.
    </p>

    <label for="origen">Dirección de origen</label>
    <input
      id="origen"
      type="text"
      placeholder="Calle de la Ilusión 39, Madrid"
    >

    <label for="municipio">Municipio</label>
    <input
      id="municipio"
      type="text"
      placeholder="Madrid"
    >

    <label for="carburante">Carburante</label>
    <select id="carburante">
      <option>Gasolina 95 E5</option>
      <option>Gasóleo A</option>
    </select>

    <label for="consumo">Consumo (l/100 km)</label>
    <input
      id="consumo"
      type="number"
      min="0"
      step="0.1"
      placeholder="6.0"
    >

    <label for="litros">Litros a repostar</label>
    <input
      id="litros"
      type="number"
      min="1"
      step="1"
      placeholder="20"
    >

    <button id="buscarBtn">
      Buscar mejores opciones
    </button>

    <div id="resultado"></div>

  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
